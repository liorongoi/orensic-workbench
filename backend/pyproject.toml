[project]
name = "forensic-workbench"
version = "0.3.0"
description = "Forensic image and video enhancement and authentication workbench"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "reportlab>=4.1",
    "mcp>=2.0",
    "PyWavelets>=1.6",
    "onnxruntime>=1.17",
    "c2pa-python>=0.38",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "cryptography>=42", "onnx>=1.15"]
tools = ["onnx>=1.15"]
desktop = ["pywebview>=6.2"]   # the Windows desktop app window (Microsoft Edge WebView2)

[project.scripts]
forensic-mcp = "forensic.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forensic*"]

[tool.setuptools.package-data]
"forensic.validation" = ["cards/*.json"]
"forensic.models" = ["manifest.json", "weights/*.onnx", "licences/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
