[project]
name = "lucida-forensic"
version = "0.3.0"
description = "Lucida: forensic image and video enhancement and authentication"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "reportlab>=4.1",
    "mcp>=2.0",
    "PyWavelets>=1.6",
    # DirectML runs the learned models on any DirectX 12 GPU on Windows, with no CUDA install;
    # it falls back to the CPU on machines without one.
    "onnxruntime>=1.17; sys_platform != 'win32'",
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",
    "c2pa-python>=0.38",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "onnx>=1.15"]
tools = ["onnx>=1.15"]
# The desktop window (python -m forensic.desktop); uses WebView2, built into Windows 10 and 11.
desktop = ["pywebview>=5.3"]

[project.scripts]
forensic-mcp = "forensic.mcp_server:main"
lucida-desktop = "forensic.desktop:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forensic*"]

[tool.setuptools.package-data]
"forensic" = ["data/*.json"]
"forensic.validation" = ["cards/*.json"]
"forensic.models" = ["manifest.json", "weights/*.onnx", "licences/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
