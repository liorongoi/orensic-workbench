name: Windows installer
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", architecture: x64 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Build the offline installer
        shell: pwsh
        run: deploy\windows\build-installer.ps1 -BuildPython python
      - uses: actions/upload-artifact@v4
        with:
          name: Lucida-Windows-Setup
          path: |
            dist/*-Setup.exe
            dist/*-Setup.exe.sha256
          compression-level: 0
          if-no-files-found: error

  # Each install is tested on a fresh runner that never saw the build.
  test:
    needs: build
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        scope: [current-user, all-users, all-users-lab]
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: deploy/windows }
      - uses: actions/download-artifact@v4
        with: { name: Lucida-Windows-Setup, path: dist }
      - name: Install, self-test offline, run, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*-Setup.exe).FullName
          switch ("${{ matrix.scope }}") {
            "all-users"     { deploy\windows\test-installer.ps1 -Installer $setup -AllUsers }
            "all-users-lab" { deploy\windows\test-installer.ps1 -Installer $setup -AllUsers -LabNetwork -DeleteCaseData }
            default         { deploy\windows\test-installer.ps1 -Installer $setup }
          }

  # Clicks through the real wizard and uninstaller and keeps a screenshot of every page.
  wizard-screenshots:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: deploy/windows }
      - uses: actions/download-artifact@v4
        with: { name: Lucida-Windows-Setup, path: dist }
      - name: Capture the wizard pages
        shell: pwsh
        run: deploy\windows\capture-wizard.ps1 -Installer (Get-ChildItem dist\*-Setup.exe).FullName -OutDir wizard-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lucida-Setup-wizard-screenshots
          path: wizard-screenshots
          if-no-files-found: warn
      - name: Publish the screenshots on the ci/wizard-screenshots branch
        # One orphan commit, replaced on every run, so the pages can be viewed without artifact access.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: |
          if (-not (Get-ChildItem wizard-screenshots\*.png -ErrorAction SilentlyContinue)) { exit 0 }
          Set-Location wizard-screenshots
          git init -q -b ci/wizard-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.png
          git commit -q -m "Wizard screenshots from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci/wizard-screenshots

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: Lucida-Windows-Setup, path: dist }
      - name: Attach the installer to the release
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ github.ref_name }}" }
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Lucida $TAG" --notes "Offline Windows installer."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
